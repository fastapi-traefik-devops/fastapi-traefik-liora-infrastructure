apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-dev
resources:
- ../../base
- service-adminer-private.yaml
components:
- ../../components/cloudnative-pg
images:
- name: backend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-backend
  newTag: sha-3303e93b753e8282dc7b461c583fb8ace43574a1
  digest: sha256:ea2d0aaf163f15f1bf749ee69822ebe33e619d2a00a5813d348732936b56f00b
- name: frontend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-frontend
  newTag: sha-3303e93b753e8282dc7b461c583fb8ace43574a1
  digest: sha256:a8d07b6be8ae8c76cc8133c885ba8ec3c095ded005db251aaf6a190e88426f82
replicas:
- name: backend
  count: 0
- name: frontend
  count: 0
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: backend-config
    data:
      BACKEND_CORS_ORIGINS: https://dev.liora.aprt.info
      DOMAIN: dev.liora.aprt.info
      ENVIRONMENT: staging
      FRONTEND_HOST: https://dev.liora.aprt.info
- target:
    kind: Ingress
    name: app-ingress
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: dev.liora.aprt.info
    - op: replace
      path: /spec/tls
      value:
        - hosts: [dev.liora.aprt.info]
          secretName: app-tls
    - op: add
      path: /spec/rules/0/http/paths/-
      value:
        path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80
- target:
    kind: Deployment
    name: backend
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/command
      value: ["fastapi", "run", "--workers", "1", "app/main.py"]
    - op: add
      path: /spec/template/metadata/annotations
      value:
        liora.aprt.info/config-revision: https-phase7
        liora.aprt.info/database: cnpg-16.15-initialized
