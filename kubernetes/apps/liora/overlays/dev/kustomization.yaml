apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-dev
resources:
- certificate.yaml
- ../../base
- service-adminer-private.yaml
components:
- ../../components/cloudnative-pg
- ../../components/r2-backup
images:
- name: backend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-backend
  newTag: sha-61b35a0becec517dd10e5e3fca96e789db068ac8
  digest: sha256:640a26a7e474b5fb686cbfc000518f32766d8bd25b91e721d086bfd32e898c40
- name: frontend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-frontend
  newTag: sha-61b35a0becec517dd10e5e3fca96e789db068ac8
  digest: sha256:3ac9b636798dbfb6864bda96303e3c00f55dab48b7af18a0d19d98484bbc9368
replicas:
- name: backend
  count: 1
- name: frontend
  count: 1
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: backend-config
    data:
      BACKEND_CORS_ORIGINS: https://dev.liora.aprt.info
      DOMAIN: dev.liora.aprt.info
      ENVIRONMENT: staging
      FRONTEND_HOST: https://dev.liora.aprt.info
- target:
    kind: Ingress
    name: app-ingress
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: dev.liora.aprt.info
    - op: replace
      path: /spec/tls
      value:
        - hosts: [dev.liora.aprt.info]
          secretName: app-tls
    - op: add
      path: /spec/rules/0/http/paths/-
      value:
        path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80
- target:
    kind: Deployment
    name: backend
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/command
      value: ["fastapi", "run", "--workers", "1", "app/main.py"]
    - op: add
      path: /spec/template/metadata/annotations
      value:
        liora.aprt.info/config-revision: https-phase7
        liora.aprt.info/database: cnpg-r2-0.15.1
