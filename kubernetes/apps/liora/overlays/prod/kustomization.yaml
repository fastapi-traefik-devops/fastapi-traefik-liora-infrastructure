apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
resources:
- certificate.yaml
- ../../base
- service-adminer-private.yaml
components:
- ../../components/cloudnative-pg
- ../../components/r2-backup
images:
- name: backend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-backend
  newTag: sha-c375967ac5b3dd7a0a6867758e16b057c733bb2d
  digest: sha256:f1a896fbc915f1f19416882fee62bf4db275860f9225d9004ac59ba9a005dc5d
- name: frontend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-frontend
  newTag: sha-c375967ac5b3dd7a0a6867758e16b057c733bb2d
  digest: sha256:7d1ac191287e0498434049d4e569aa8f8a8ed2dbd19921e20bc566c95b2a4c91
replicas:
- name: backend
  count: 2
- name: frontend
  count: 2
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: "apiVersion: v1\ndata:\n  BACKEND_CORS_ORIGINS: https://liora.aprt.info\n\
    \  DOMAIN: liora.aprt.info\n  ENVIRONMENT: production\n  FRONTEND_HOST: https://liora.aprt.info\n\
    kind: ConfigMap\nmetadata:\n  name: backend-config\n"
- target:
    kind: Ingress
    name: app-ingress
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: liora.aprt.info\n-\
    \ op: replace\n  path: /spec/tls/0/hosts/0\n  value: liora.aprt.info\n"
- target:
    kind: Deployment
    name: backend
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/command
      value: ["fastapi", "run", "--workers", "1", "app/main.py"]
- target:
    group: postgresql.cnpg.io
    kind: Cluster
    name: liora-db
  patch: |-
    - op: replace
      path: /spec/instances
      value: 2
- target:
    group: barmancloud.cnpg.io
    kind: ObjectStore
    name: r2-backup
  patch: |-
    - op: replace
      path: /spec/configuration/destinationPath
      value: s3://liora-backup/prod/
    - op: replace
      path: /spec/retentionPolicy
      value: 14d
- target:
    group: postgresql.cnpg.io
    kind: Cluster
    name: liora-db
  patch: |-
    - op: replace
      path: /spec/plugins/0/parameters/serverName
      value: liora-prod
