apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-stage
resources:
- certificate.yaml
- ../../base
- service-adminer-private.yaml
components:
- ../../components/cloudnative-pg
- ../../components/r2-backup
images:
- name: backend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-backend
  newTag: sha-48b443fc69f2bdb17d52d95526e84811ab13b6d0
  digest: sha256:640a26a7e474b5fb686cbfc000518f32766d8bd25b91e721d086bfd32e898c40
- name: frontend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-frontend
  newTag: sha-48b443fc69f2bdb17d52d95526e84811ab13b6d0
  digest: sha256:3ac9b636798dbfb6864bda96303e3c00f55dab48b7af18a0d19d98484bbc9368
replicas:
- name: backend
  count: 1
- name: frontend
  count: 1
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: "apiVersion: v1\ndata:\n  BACKEND_CORS_ORIGINS: https://stage.liora.aprt.info\n\
    \  DOMAIN: stage.liora.aprt.info\n  ENVIRONMENT: staging\n  FRONTEND_HOST: https://stage.liora.aprt.info\n\
    kind: ConfigMap\nmetadata:\n  name: backend-config\n"
- target:
    kind: Ingress
    name: app-ingress
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: stage.liora.aprt.info\n\
    - op: replace\n  path: /spec/tls/0/hosts/0\n  value: stage.liora.aprt.info\n"
- target:
    kind: Deployment
    name: backend
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/command
      value: ["fastapi", "run", "--workers", "1", "app/main.py"]
- target:
    group: barmancloud.cnpg.io
    kind: ObjectStore
    name: r2-backup
  patch: |-
    - op: replace
      path: /spec/configuration/destinationPath
      value: s3://liora-backup/stage/
- target:
    group: postgresql.cnpg.io
    kind: Cluster
    name: liora-db
  patch: |-
    - op: replace
      path: /spec/plugins/0/parameters/serverName
      value: liora-stage
