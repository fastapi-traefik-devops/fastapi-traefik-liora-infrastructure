apiVersion: v1
kind: Service
metadata:
  name: adminer-private
  namespace: app-stage
  labels:
    liora.aprt.info/access: private-admin
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.77.16
spec:
  type: LoadBalancer
  loadBalancerClass: liora.aprt.info/admin-vip
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app: adminer
  ports:
  - name: http
    port: 8082
    targetPort: 8080
    protocol: TCP
