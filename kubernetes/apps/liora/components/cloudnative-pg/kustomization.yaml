apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- cluster.yaml
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: backend-config
    data:
      POSTGRES_USER: app_owner
- target:
    kind: Service
    name: db
  patch: |-
    - op: replace
      path: /spec/selector
      value:
        cnpg.io/cluster: liora-db
        role: primary
- target:
    kind: Deployment
    name: backend
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
    spec:
      template:
        metadata:
          annotations:
            liora.aprt.info/database: cnpg-16.15-initialized
