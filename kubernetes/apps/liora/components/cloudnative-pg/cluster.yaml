apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: liora-db
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-system-trixie@sha256:8ca5699981c25db72e549e9fa69561bac233df15b9b1e3a6282847b0629bb5ea
  enableSuperuserAccess: true
  superuserSecret:
    name: cnpg-superuser
  bootstrap:
    initdb:
      database: app
      owner: app_owner
      secret:
        name: cnpg-app
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: '1', memory: 1Gi}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: '100'
      max_wal_size: 512MB
      min_wal_size: 80MB
      wal_keep_size: 128MB
