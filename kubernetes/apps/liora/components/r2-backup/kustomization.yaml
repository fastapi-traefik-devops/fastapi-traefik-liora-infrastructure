apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- objectstore.yaml
patches:
- target:
    group: postgresql.cnpg.io
    kind: Cluster
    name: liora-db
  patch: |-
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: liora-db
    spec:
      plugins:
      - name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: r2-backup
          serverName: liora-dev
      postgresql:
        parameters:
          archive_timeout: 300s
