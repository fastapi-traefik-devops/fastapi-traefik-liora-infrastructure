apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liora-root-prod
  namespace: argocd
spec:
  project: liora-bootstrap
  source:
    repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-infrastructure.git
    targetRevision: main
    path: kubernetes/gitops/argocd/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - FailOnSharedResource=true
