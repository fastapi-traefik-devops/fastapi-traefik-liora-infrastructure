# Automation enabled after verified manual adoption; PVC retention remains in the overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-prod
  namespace: argocd
spec:
  project: fastapi
  source:
    repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/liora/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: app-prod
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
