# Enable automation only after publishing this revision and reviewing the live diff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-stage
  namespace: argocd
spec:
  project: fastapi
  source:
    repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/liora/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
