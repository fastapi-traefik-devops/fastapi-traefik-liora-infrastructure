apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/c2b1e3017e2cec86b122172e861dcd026453ae44/manifests/install.yaml
patches:
- target:
    kind: StatefulSet
    name: argocd-application-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
- target:
    kind: Deployment
    name: argocd-repo-server
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 768Mi
- target:
    kind: Deployment
    name: argocd-server
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
- target:
    kind: Deployment
    name: argocd-redis
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
- target:
    kind: Deployment
    name: argocd-dex-server
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
- target:
    kind: Deployment
    name: argocd-applicationset-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
- target:
    kind: Deployment
    name: argocd-notifications-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
