apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-admin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip-admin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-admin
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: kube-vip-admin
      nodeSelector:
        node-role.kubernetes.io/control-plane: 'true'
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      containers:
      - name: kube-vip
        image: ghcr.io/kube-vip/kube-vip:v1.2.3
        args:
        - manager
        env:
        - name: vip_arp
          value: 'true'
        - name: vip_interface
          value: eth0
        - name: vip_subnet
          value: '32'
        - name: cp_enable
          value: 'false'
        - name: svc_enable
          value: 'true'
        - name: svc_election
          value: 'false'
        - name: svc_leasename
          value: kube-system/liora-admin-services
        - name: vip_leaderelection
          value: 'true'
        - name: vip_leaseduration
          value: '15'
        - name: vip_renewdeadline
          value: '10'
        - name: vip_retryperiod
          value: '2'
        - name: lb_class_only
          value: 'true'
        - name: lb_class_name
          value: liora.aprt.info/admin-vip
        - name: lb_class_legacy_handling
          value: 'false'
        - name: prometheus_server
          value: :2113
        - name: vip_nodename
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            drop:
            - ALL
