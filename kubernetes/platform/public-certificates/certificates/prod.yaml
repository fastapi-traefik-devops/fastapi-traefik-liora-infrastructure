apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: app-prod
spec:
  secretName: app-tls
  dnsNames:
  - liora.aprt.info
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
