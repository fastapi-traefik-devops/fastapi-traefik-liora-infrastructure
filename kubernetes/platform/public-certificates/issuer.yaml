apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account
    solvers:
    - selector:
        dnsNames:
        - dev.liora.aprt.info
        - stage.liora.aprt.info
        - liora.aprt.info
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-dns-token
            key: api-token
