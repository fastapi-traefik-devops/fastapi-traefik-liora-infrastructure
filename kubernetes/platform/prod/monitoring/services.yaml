apiVersion: v1
kind: Service
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    liora.aprt.info/access: private-admin
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.77.17
spec:
  type: LoadBalancer
  loadBalancerClass: liora.aprt.info/admin-vip
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
