      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "GitOps",
        "PROD"
      ],
      "editable": false,
      "panels": [
        {
          "id": 7,
          "title": "PROD application status",
          "description": "Current observed health and sync status for app-prod and app-prod, independently. Missing applications have no row; use the overview expected-count Stats to detect missing applications. Inspect Argo resource health for Degraded and Git diff for OutOfSync.",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by(name,health_status,sync_status) (argocd_app_info{name=~\"app-prod\"})",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "indexByName": {
                  "name": 0,
                  "health_status": 1,
                  "sync_status": 2
                },
                "renameByName": {
                  "name": "Application",
                  "health_status": "Health",
                  "sync_status": "Sync"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "cellOptions": {
                  "type": "color-text"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Healthy": {
                            "text": "Healthy",
                            "color": "green"
                          },
                          "Degraded": {
                            "text": "Degraded",
                            "color": "red"
                          },
                          "Progressing": {
                            "text": "Progressing",
                            "color": "yellow"
                          },
                          "Missing": {
                            "text": "Missing",
                            "color": "red"
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "yellow"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Sync"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Synced": {
                            "text": "Synced",
                            "color": "green"
                          },
                          "OutOfSync": {
                            "text": "OutOfSync",
                            "color": "red"
                          },
                          "Unknown": {
                            "text": "Unknown",
                            "color": "yellow"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 1,
          "title": "Application state",
          "description": "Argo application labels expose health and sync independently; value is always 1. Healthy: Labels Healthy and Synced for both apps. Investigate: Degraded/Progressing/Missing/Unknown or OutOfSync/Unknown sustained. Action: Inspect Argo application conditions, resource tree, operation and Git diff.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "argocd_app_info{name=~\"app-prod\"}",
              "legendFormat": "{{name}} {{health_status}} {{sync_status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
