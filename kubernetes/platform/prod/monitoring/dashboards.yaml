apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-platform-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  platform-nodes.json: |
    {
      "uid": "platform-nodes",
      "title": "PROD / Platform Overview",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "1m",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "GitOps",
        "PROD"
      ],
      "editable": false,
      "panels": [
        {
          "id": 9,
          "title": "PROD health now",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "title": "Argo applications Healthy",
          "description": "Expected 1: app-prod. Below 1 needs investigation; no telemetry is not healthy.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{name=~\"app-prod\",health_status=\"Healthy\"}) or (0 * sum(argocd_app_info{name=~\"app-prod\"}))",
              "legendFormat": "Argo applications Healthy",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No telemetry",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 11,
          "title": "Argo applications Synced",
          "description": "Expected 1: app-prod. Below 1 needs investigation; no telemetry is not healthy.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 5,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{name=~\"app-prod\",sync_status=\"Synced\"}) or (0 * sum(argocd_app_info{name=~\"app-prod\"}))",
              "legendFormat": "Argo applications Synced",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No telemetry",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 12,
          "title": "Missing replicas",
          "description": "PROD desired minus available replicas, clamped per deployment. Healthy is zero. Inspect rollout, probes and scheduling if positive.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 10,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(clamp_min(kube_deployment_spec_replicas{namespace=~\"app-prod\"} - kube_deployment_status_replicas_available{namespace=~\"app-prod\"}, 0))",
              "legendFormat": "Missing replicas",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No telemetry",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 13,
          "title": "Container restarts (15m)",
          "description": "PROD restarts over 15 minutes. Fractional values are counter extrapolation. Inspect previous logs and termination reasons.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"app-prod\"}[15m]))",
              "legendFormat": "Container restarts (15m)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No telemetry",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 14,
          "title": "Firing alerts",
          "description": "Current firing Prometheus alerts across the monitored platform. ALERTS exists only while an alert is pending/firing. An empty set means zero only while the Prometheus self-scrape is UP; no healthy self-scrape means no telemetry. Direct Alertmanager notification tests are not Prometheus rule alerts.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ALERTS{alertstate=\"firing\"}) or (0 * max(up{job=\"monitoring-prometheus\"} == 1))",
              "legendFormat": "Firing alerts",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No telemetry",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 1,
          "title": "Cluster CPU busy fraction",
          "description": "CPU-weighted cluster busy fraction; indicates aggregate capacity. Healthy: Below 85% and no saturated individual node. Investigate: Sustained high usage or a hot node hidden by the average. Action: Use the per-node panel to locate saturation; investigate heavy pods.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - sum(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])) / count(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"})",
              "legendFormat": "cluster"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "Cluster memory used fraction",
          "description": "Capacity-weighted unavailable memory fraction; indicates aggregate headroom. Healthy: Below 90% and no pressured node. Investigate: High aggregate use or individual-node pressure. Action: Compare per-node usage with workload memory and host available RAM.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - sum(node_memory_MemAvailable_bytes{job=\"node-exporter\"}) / sum(node_memory_MemTotal_bytes{job=\"node-exporter\"})",
              "legendFormat": "cluster"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Node CPU busy fraction",
          "description": "Fraction of CPU time outside idle; identifies sustained saturation. Healthy: Below 85%, with headroom for builds. Investigate: Above 85% for 15m triggers NodeHighCPU. Action: Check kubectl top pods -A; reduce competing jobs or add capacity.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - avg by(instance) (rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Node memory used fraction",
          "description": "Memory unavailable for new allocations, allowing for reclaimable cache; tracks OOM risk. Healthy: Below 90%, with available headroom. Investigate: Above 90% for 15m triggers NodeHighMemory. Action: Check host free -h and kubectl top pods -A; reduce load and inspect leaks.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"}",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "Filesystem available bytes",
          "description": "Bytes available to ordinary users per filesystem; detects storage exhaustion. Healthy: Stable free capacity sufficient for retention and image growth. Investigate: Falling capacity or DiskPressure. Action: Check df -h and df -i on host/node; review image/log growth and PVC usage before cleanup.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_filesystem_avail_bytes{job=\"node-exporter\",fstype!~\"tmpfs|overlay|squashfs\"}",
              "legendFormat": "{{instance}} {{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "Node conditions",
          "description": "Kubernetes node condition gauges; eviction and readiness signals. Healthy: Ready=1; all pressure conditions=0. Investigate: Ready=0 or any pressure condition=1. Action: Describe the node and inspect events, RAM, disk and inodes.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_node_status_condition{status=\"true\",condition=~\"Ready|MemoryPressure|DiskPressure|PIDPressure\"}",
              "legendFormat": "{{node}} {{condition}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Scrape target availability",
          "description": "1 for successful scrape, 0 for failed scrape; detects missing monitoring data. Healthy: All expected targets=1. Investigate: A target=0, missing expected target, or stale samples. Action: Open Prometheus /targets; inspect lastError, selector labels, endpoints and exporter pod logs.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up",
              "legendFormat": "{{job}} {{instance}} {{endpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "Alertmanager instances discovered",
          "description": "Number of discovered Alertmanager endpoints; verifies routing discovery. Healthy: 1 in this single-instance setup. Investigate: 0 or unexpected loss of discovery. Action: Inspect Prometheus /api/v1/alertmanagers and monitoring-alertmanager endpoints.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_notifications_alertmanagers_discovered",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
  dev-stage-workloads.json: |
    {
      "uid": "prod-workloads",
      "title": "PROD / Workloads",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "1m",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "GitOps",
        "PROD"
      ],
      "editable": false,
      "panels": [
        {
          "id": 1,
          "title": "Namespace CPU",
          "description": "Total PROD workload CPU cores; supports environment capacity comparison. Healthy: Stable relative to workload and node capacity. Investigate: Unexpected growth or competition with other namespaces. Action: Compare PROD pod CPU and recent deployments/load.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "namespace CPU"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "Namespace memory",
          "description": "Total environment working set; shows memory footprint. Healthy: Stable with adequate node capacity. Investigate: Rising footprint or loss of headroom. Action: Identify the growing pod and inspect its memory limits and logs.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "namespace memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Pod CPU",
          "description": "CPU seconds per second across real containers; 1 core=1000m, identifies expensive pods. Healthy: Stable use with headroom against limits. Investigate: Sustained limit-level use, throttling or growing latency. Action: Inspect top pods, resource requests/limits and request volume.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{namespace}} {{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "noValue": "No observations",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
