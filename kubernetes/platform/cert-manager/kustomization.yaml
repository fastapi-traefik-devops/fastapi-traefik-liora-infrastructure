apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- upstream/cert-manager-1.21.2.yaml
images:
- name: quay.io/jetstack/cert-manager-controller
  newTag: v1.21.2
  digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
- name: quay.io/jetstack/cert-manager-cainjector
  newTag: v1.21.2
  digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
- name: quay.io/jetstack/cert-manager-webhook
  newTag: v1.21.2
  digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
- name: quay.io/jetstack/cert-manager-acmesolver
  newTag: v1.21.2
  digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
patches:
- target:
    kind: Deployment
    name: cert-manager-cainjector
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 64Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 256Mi\n"
- target:
    kind: Deployment
    name: cert-manager
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 64Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 256Mi\n- op: replace\n  path: /spec/template/spec/containers/0/args\n\
    \  value:\n  - --v=2\n  - --cluster-resource-namespace=$(POD_NAMESPACE)\n  - --leader-election-namespace=kube-system\n\
    \  - --acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver:v1.21.2@sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503\n\
    \  - --max-concurrent-challenges=60\n  - --controllers=certificates-trigger,certificates-issuing,certificates-key-manager,certificates-request-manager,certificates-readiness,certificates-revision-manager,certificaterequests-issuer-selfsigned,certificaterequests-approver,issuers,clusterissuers\n\
    \  - --namespace=cnpg-system\n"
- target:
    kind: Deployment
    name: cert-manager-webhook
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 64Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 256Mi\n"
