# Adapted from upstream/monitoring/values.yaml; native private access only.
fullnameOverride: monitoring
defaultRules:
  create: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
crds:
  enabled: true
  upgradeJob:
    enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 40m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    retention: 3d
    retentionSize: 1500MB
    scrapeInterval: 60s
    evaluationInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels:
        release: monitoring
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        release: monitoring
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    storageSpec:
      volumeClaimTemplate:
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          storageClassName: local-path
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    externalLabels:
      cluster: nonprod
    externalUrl: http://192.168.77.16:9090
alertmanager:
  ingress:
    enabled: false
  config:
    # Use only reviewed dependency inhibition; never inhibit testing alerts.
    templates: []
    inhibit_rules:
    - source_matchers:
      - alertname="CNPGBackupCollectorStale"
      - purpose!="test"
      target_matchers:
      - alertname=~"CNPGBackupTelemetryMissing|CNPGBackupCycleTelemetryMissing|R2BackupUsageTelemetryMissing"
      - purpose!="test"
      equal:
      - cluster
    - source_matchers:
      - alertname="CNPGBackupCollectorStale"
      - purpose!="test"
      target_matchers:
      - alertname="PrometheusTargetDown"
      - job="backup-coordinator"
      - purpose!="test"
      equal:
      - cluster
    - source_matchers:
      - alertname="PrometheusTargetDown"
      - job="kube-state-metrics"
      - purpose!="test"
      target_matchers:
      - alertname="MonitoringMetricsMissing"
      - metric=~"kube_.*"
      - purpose!="test"
      equal:
      - cluster
    - source_matchers:
      - alertname="PublicCertificateExpiryCritical"
      - purpose!="test"
      target_matchers:
      - alertname="PublicCertificateExpiringSoon"
      - purpose!="test"
      equal:
      - cluster
      - namespace
      - name
    - source_matchers:
      - alertname="PVCBackingFilesystemSpaceCritical"
      - purpose!="test"
      target_matchers:
      - alertname="PVCBackingFilesystemSpaceLow"
      - purpose!="test"
      equal:
      - cluster
      - node
    - source_matchers:
      - alertname="PVCBackingFilesystemInodesCritical"
      - purpose!="test"
      target_matchers:
      - alertname="PVCBackingFilesystemInodesLow"
      - purpose!="test"
      equal:
      - cluster
      - node
    global:
      resolve_timeout: 5m
    route:
      receiver: discard
      group_by:
      - cluster
      - environment
      - alertname
      - namespace
      - severity
      - purpose
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 12h
      routes:
      - matchers:
        - cluster="nonprod"
        receiver: slack-nonprod
        routes:
        - matchers:
          - purpose="test"
          receiver: slack-testing
          group_by:
          - cluster
          - alertname
          - test_id
          group_wait: 10s
          group_interval: 30s
          repeat_interval: 1h
        - matchers:
          - severity="critical"
          receiver: slack-nonprod
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
          - severity="warning"
          receiver: slack-nonprod
    receivers:
    - name: discard
    - name: slack-nonprod
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/monitoring-slack-nonprod/normal-webhook
        channel: '#liora-alerts-nonprod'
        send_resolved: true
        title: '[NONPROD][{{ .Status | toUpper }}][{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }} ({{ len .Alerts.Firing }} firing, {{ len .Alerts.Resolved }} resolved)'
        text: |-

          *Cluster:* NONPROD
          {{ range .Alerts }}
          *[{{ .Status | toUpper }}] {{ .Labels.alertname }}*
          {{ with .Labels.severity }}*Severity:* {{ . }}{{ "\n" }}{{ end }}
          {{- $environment := or .Labels.environment .Labels.env }}
          {{- if not $environment }}
          {{- $scope := or .Labels.namespace "" }}
          {{- if not (match "^app-(dev|stage|prod)$" $scope) }}{{ $scope = or .Labels.name "" }}{{ end }}
          {{- if eq $scope "app-dev" }}{{ $environment = "DEV" }}
          {{- else if eq $scope "app-stage" }}{{ $environment = "STAGE" }}
          {{- else if eq $scope "app-prod" }}{{ $environment = "PROD" }}{{ end }}
          {{- end }}
          {{ if not $environment }}{{ $environment = "PLATFORM" }}{{ end }}
          {{ with $environment }}*Environment:* {{ . | toUpper }}{{ "\n" }}{{ end -}}
          {{ with .Labels.namespace }}*Namespace:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.job }}*Job:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.pod }}*Pod:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.node }}*Node:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.deployment }}*Deployment:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.service }}*Service:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.instance }}*Instance:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.container }}*Container:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.name }}*Application:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Annotations.summary }}*Summary:* {{ . }}{{ "\n" }}{{ end -}}
          *Description:* {{ or .Annotations.description .Annotations.summary "Inspect the alert expression in Prometheus." }}{{ "\n" }}
          *Action:* {{ or .Annotations.action "Inspect the affected resource and scrape target in this cluster; consult docs/operations/SLACK_ALERTING.md." }}{{ "\n" }}
          {{ with .GeneratorURL }}*Source:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Annotations.runbook_url }}*Runbook:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.subject }}*Certificate:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.metric }}*Missing metric:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.test_id }}*Test ID:* {{ . }}{{ "\n" }}{{ end -}}
          *Started:* {{ .StartsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}
          {{ if eq .Status "resolved" }}*Resolved:* {{ .EndsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}{{ "\n" }}{{ end }}
          {{ end }}
    - name: slack-testing
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/monitoring-slack-nonprod/testing-webhook
        channel: '#liora-alerts-testing'
        send_resolved: true
        title: '[NONPROD][{{ .Status | toUpper }}][{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }} ({{ len .Alerts.Firing }} firing, {{ len .Alerts.Resolved }} resolved)'
        text: |-

          *Cluster:* NONPROD
          {{ range .Alerts }}
          *[{{ .Status | toUpper }}] {{ .Labels.alertname }}*
          {{ with .Labels.severity }}*Severity:* {{ . }}{{ "\n" }}{{ end }}
          {{- $environment := or .Labels.environment .Labels.env }}
          {{- if not $environment }}
          {{- $scope := or .Labels.namespace "" }}
          {{- if not (match "^app-(dev|stage|prod)$" $scope) }}{{ $scope = or .Labels.name "" }}{{ end }}
          {{- if eq $scope "app-dev" }}{{ $environment = "DEV" }}
          {{- else if eq $scope "app-stage" }}{{ $environment = "STAGE" }}
          {{- else if eq $scope "app-prod" }}{{ $environment = "PROD" }}{{ end }}
          {{- end }}
          {{ if not $environment }}{{ $environment = "PLATFORM" }}{{ end }}
          {{ with $environment }}*Environment:* {{ . | toUpper }}{{ "\n" }}{{ end -}}
          {{ with .Labels.namespace }}*Namespace:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.job }}*Job:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.pod }}*Pod:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.node }}*Node:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.deployment }}*Deployment:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.service }}*Service:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.instance }}*Instance:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.container }}*Container:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.name }}*Application:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Annotations.summary }}*Summary:* {{ . }}{{ "\n" }}{{ end -}}
          *Description:* {{ or .Annotations.description .Annotations.summary "Inspect the alert expression in Prometheus." }}{{ "\n" }}
          *Action:* {{ or .Annotations.action "Inspect the affected resource and scrape target in this cluster; consult docs/operations/SLACK_ALERTING.md." }}{{ "\n" }}
          {{ with .GeneratorURL }}*Source:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Annotations.runbook_url }}*Runbook:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.subject }}*Certificate:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.metric }}*Missing metric:* {{ . }}{{ "\n" }}{{ end -}}
          {{ with .Labels.test_id }}*Test ID:* {{ . }}{{ "\n" }}{{ end -}}
          *Started:* {{ .StartsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}
          {{ if eq .Status "resolved" }}*Resolved:* {{ .EndsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}{{ "\n" }}{{ end }}
          {{ end }}
  alertmanagerSpec:
    secrets:
    - monitoring-slack-nonprod
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          storageClassName: local-path
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 256Mi
    externalUrl: http://192.168.77.16:9093
kube-state-metrics:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
prometheus-node-exporter:
  hostNetwork: false
  service:
    enableHostPort: false
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
grafana:
  replicas: 1
  defaultDashboardsEnabled: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: false
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    server:
      root_url: http://192.168.77.16:3000/
      domain: 192.168.77.16
      enforce_domain: false
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    datasources:
      enabled: false
    dashboards:
      enabled: true
      searchNamespace: monitoring
      skipReload: true
      initDashboards: false
      provider:
        allowUiUpdates: false
        disableDelete: true
        updateIntervalSeconds: 30
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus NONPROD
        uid: prometheus
        type: prometheus
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
  testFramework:
    enabled: false
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    failureThreshold: 90
coreDns:
  enabled: false
