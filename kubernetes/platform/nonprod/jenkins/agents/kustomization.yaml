apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../held
- workloads.yaml
patches:
- path: controller-config.yaml
- target:
    kind: Deployment
    name: jenkins
    namespace: jenkins
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: jenkins
      namespace: jenkins
    spec:
      template:
        metadata:
          annotations:
            liora.aprt.info/checkpoint: phase9-agents-held
