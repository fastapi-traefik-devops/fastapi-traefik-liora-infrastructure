apiVersion: v1
kind: Service
metadata:
  name: argocd-admin
  namespace: argocd
  labels:
    liora.aprt.info/access: private-admin
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.77.16
spec:
  type: LoadBalancer
  loadBalancerClass: liora.aprt.info/admin-vip
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
  - name: https
    port: 8080
    targetPort: 8080
    protocol: TCP
