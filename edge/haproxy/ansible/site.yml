- name: Configure the dedicated Liora ingress edge
  hosts: all
  become: true
  tasks:
    - name: Install HAProxy
      ansible.builtin.apt:
        name: [haproxy]
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 1200
    - name: Install validated application-only routing
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/haproxy -c -f %s
      notify: Reload HAProxy
    - name: Enable HAProxy
      ansible.builtin.systemd_service:
        name: haproxy
        enabled: true
        state: started
  handlers:
    - name: Reload HAProxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: reloaded
