apiVersion: v1
kind: Namespace
metadata:
  name: dr-storage
  labels: {liora-dr-run: '20261024'}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint
  namespace: dr-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence
  namespace: dr-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: dr-persistence}
  template:
    metadata:
      labels: {app: dr-persistence}
    spec:
      containers:
      - name: storage
        image: alpine:3.20
        command: ['sh', '-c', 'if [ ! -f /data/marker ]; then echo liora-dr-20261024 > /data/marker; fi; sleep 86400']
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: checkpoint}
