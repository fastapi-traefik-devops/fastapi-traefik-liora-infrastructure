all:
  children:
    k3s_servers:
      hosts:
        k3s-1-01:
          ansible_host: 192.168.77.201
          node_ip: 192.168.77.201
        k3s-1-02:
          ansible_host: 192.168.77.202
          node_ip: 192.168.77.202
        k3s-1-03:
          ansible_host: 192.168.77.203
          node_ip: 192.168.77.203

  vars:
    ansible_user: root-admin
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

    k3s_cluster_name: dev-stage
    k3s_token: "{{ lookup('ansible.builtin.file', inventory_dir + '/../../../recovery/k3s-dev-stage.token') }}"
    k3s_version: "v1.36.5+k3s1"
    k3s_api_vip: "192.168.77.11"
    k3s_vip_interface: "eth0"
    kube_vip_version: "v1.2.3"
