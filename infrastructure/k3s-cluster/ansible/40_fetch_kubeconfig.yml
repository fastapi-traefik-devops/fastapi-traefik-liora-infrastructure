---
- name: Fetch cluster kubeconfig
  hosts: "{{ groups['k3s_servers'][0] }}"
  become: true

  tasks:
    - name: Read kubeconfig from first server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: raw_kubeconfig
      no_log: true

    - name: Parse fetched kubeconfig
      ansible.builtin.set_fact:
        fetched_kubeconfig: "{{ raw_kubeconfig.content | b64decode | from_yaml }}"
      no_log: true

    - name: Require one cluster, user and context in the fetched kubeconfig
      ansible.builtin.assert:
        that:
          - fetched_kubeconfig.clusters | length == 1
          - fetched_kubeconfig.users | length == 1
          - fetched_kubeconfig.contexts | length == 1
        fail_msg: "Expected exactly one cluster, user and context in the fetched K3s kubeconfig."

    - name: Ensure the management kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false

    - name: Create named kubeconfig on the management VM
      ansible.builtin.copy:
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config-{{ k3s_cluster_name }}"
        mode: "0600"
        backup: true
        content: "{{ named_kubeconfig | to_nice_yaml(indent=2, sort_keys=false) }}"
      vars:
        ansible_become: false
        cluster_name: "{{ k3s_cluster_name }}"
        user_name: "admin-{{ k3s_cluster_name }}"
        named_kubeconfig: >-
          {{ fetched_kubeconfig | combine({
            'clusters': [fetched_kubeconfig.clusters[0] | combine({
              'name': cluster_name,
              'cluster': fetched_kubeconfig.clusters[0].cluster | combine({
                'server': 'https://' + k3s_api_vip + ':6443'
              })
            })],
            'users': [fetched_kubeconfig.users[0] | combine({'name': user_name})],
            'contexts': [fetched_kubeconfig.contexts[0] | combine({
              'name': cluster_name,
              'context': fetched_kubeconfig.contexts[0].context | combine({
                'cluster': cluster_name,
                'user': user_name,
                'namespace': 'default'
              })
            })],
            'current-context': cluster_name
          }) }}
      delegate_to: localhost
      become: false
      no_log: true
