---
- name: Merge the two management kubeconfigs
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    kube_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"

  tasks:
    - name: Check both cluster kubeconfigs exist
      ansible.builtin.stat:
        path: "{{ kube_dir }}/config-{{ item }}"
      loop:
        - dev-stage
        - prod
      register: kubeconfig_files

    - name: Require both cluster kubeconfigs
      ansible.builtin.assert:
        that: kubeconfig_files.results | map(attribute='stat.exists') | min
        fail_msg: "Run site.yml once for each cluster before merging kubeconfigs."

    - name: Read both named kubeconfigs
      ansible.builtin.set_fact:
        dev_config: "{{ lookup('ansible.builtin.file', kube_dir + '/config-dev-stage') | from_yaml }}"
        prod_config: "{{ lookup('ansible.builtin.file', kube_dir + '/config-prod') | from_yaml }}"
      no_log: true

    - name: Verify distinct cluster identities and API endpoints
      ansible.builtin.assert:
        that:
          - dev_config.clusters | length == 1
          - dev_config.users | length == 1
          - dev_config.contexts | length == 1
          - prod_config.clusters | length == 1
          - prod_config.users | length == 1
          - prod_config.contexts | length == 1
          - dev_config.clusters[0].name == 'dev-stage'
          - prod_config.clusters[0].name == 'prod'
          - dev_config.contexts[0].name == 'dev-stage'
          - prod_config.contexts[0].name == 'prod'
          - dev_config.clusters[0].cluster.server == 'https://192.168.77.11:6443'
          - prod_config.clusters[0].cluster.server == 'https://192.168.77.12:6443'
        fail_msg: "The cluster kubeconfigs have unexpected names or API VIPs."

    - name: Write the merged default kubeconfig
      ansible.builtin.copy:
        dest: "{{ kube_dir }}/config"
        mode: "0600"
        backup: true
        content: "{{ merged_config | to_nice_yaml(indent=2, sort_keys=false) }}"
      vars:
        merged_config: >-
          {{ dev_config | combine({
            'clusters': dev_config.clusters + prod_config.clusters,
            'users': dev_config.users + prod_config.users,
            'contexts': dev_config.contexts + prod_config.contexts,
            'current-context': 'dev-stage'
          }) }}
      no_log: true
