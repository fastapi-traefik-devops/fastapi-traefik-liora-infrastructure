---
# Run separately after cluster bootstrap. Never imports site.yml or generates tokens.
- name: Configure native K3s etcd snapshots to R2
  hosts: k3s_servers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars:
    backup_cluster: "{{ 'nonprod' if k3s_cluster_name == 'dev-stage' else 'prod' }}"
    backup_inputs: "{{ lookup('ansible.builtin.file', inventory_dir + '/../../../recovery/recovery.yaml') | from_yaml }}"
    minute: "{{ (0 if backup_cluster == 'nonprod' else 10) + 2 * groups['k3s_servers'].index(inventory_hostname) }}"
    secret_data:
      etcd-s3-endpoint: "{{ backup_inputs.database_backups.endpoint | urlsplit('hostname') }}"
      etcd-s3-access-key: "{{ backup_inputs.database_backups.access_key_id }}"
      etcd-s3-secret-key: "{{ backup_inputs.database_backups.secret_access_key }}"
      etcd-s3-bucket: liora-backup
      etcd-s3-folder: "etcd/{{ backup_cluster }}"
      etcd-s3-region: "{{ backup_inputs.database_backups.region }}"
      etcd-s3-bucket-lookup-type: path
      etcd-s3-retention: '42'
      etcd-s3-timeout: 2m
      etcd-s3-insecure: 'false'
      etcd-s3-skip-ssl-verify: 'false'
  pre_tasks:
    - name: Check cluster selection and recovery endpoint
      ansible.builtin.assert:
        that:
          - k3s_cluster_name in ['dev-stage', 'prod']
          - groups['k3s_servers'] | length == 3
          - backup_inputs.database_backups.bucket == 'liora-backup'
          - backup_inputs.database_backups.endpoint is match('^https://[^/]+/?$')
      no_log: true
    - name: Check actual node identity
      ansible.builtin.command: hostname
      register: actual_hostname
      changed_when: false
    - name: Require original node name
      ansible.builtin.assert:
        that: actual_hostname.stdout == inventory_hostname
    - name: Check the native snapshot implementation version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: actual_version
      changed_when: false
    - name: Require the inventory K3s version
      ansible.builtin.assert:
        that: k3s_version in actual_version.stdout
    - name: Check scheduler timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: snapshot_timezone
      changed_when: false
    - name: Require UTC for the native scheduler
      ansible.builtin.assert:
        that: snapshot_timezone.stdout in ['Etc/UTC', 'UTC']
    - name: Require all three nodes Ready before changing this server
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl --request-timeout=20s wait nodes --all
        --for=condition=Ready --timeout=180s
      changed_when: false
    - name: Check node count and membership
      ansible.builtin.command: /usr/local/bin/k3s kubectl --request-timeout=20s get nodes -o json
      register: nodes_before
      changed_when: false
    - name: Require the selected three-server membership
      ansible.builtin.assert:
        that: (nodes_before.stdout | from_json)['items'] | map(attribute='metadata.name') | sort == groups['k3s_servers'] | sort
  tasks:
    - name: Provision the cluster S3 configuration Secret without logging credentials
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --request-timeout=20s, apply, -f, '-']
        stdin: "{{ {'apiVersion': 'v1', 'kind': 'Secret', 'metadata': {'name': 'k3s-etcd-r2', 'namespace': 'kube-system'}, 'type': 'etcd.k3s.cattle.io/s3-config-secret', 'stringData': secret_data} | to_json }}"
      when: inventory_hostname == groups['k3s_servers'][0]
      no_log: true
    - name: Create the K3s drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        mode: '0755'
    - name: Configure only native snapshot settings
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/90-etcd-r2.yaml
        mode: '0644'
        content: |
          # Managed by 60_etcd_r2.yml. Native K3s scheduler; node timezone is UTC.
          etcd-disable-snapshots: false
          etcd-snapshot-name: etcd-snapshot
          etcd-snapshot-schedule-cron: "{{ minute }} 3,15 * * *"
          etcd-snapshot-retention: 5
          etcd-snapshot-compress: true
          etcd-s3: true
          etcd-s3-config-secret: k3s-etcd-r2
      register: snapshot_config
    - name: Restart only this server when its snapshot settings change
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: snapshot_config.changed
    - name: Wait for this server API and embedded etcd readiness
      ansible.builtin.command: /usr/local/bin/k3s kubectl --request-timeout=10s get --raw=/readyz
      register: ready
      until: ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
    - name: Require every node Ready before proceeding
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl --request-timeout=20s wait nodes --all
        --for=condition=Ready --timeout=180s
      changed_when: false
