---
- name: Join remaining K3s servers through kube-vip
  hosts: "k3s_servers:!{{ groups['k3s_servers'][0] }}"
  become: true
  serial: 1

  tasks:
    - name: Create K3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write joining-server K3s configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          server: "https://{{ k3s_api_vip }}:6443"
          token: "{{ k3s_token }}"
          node-ip: "{{ node_ip }}"
          tls-san:
            - "{{ k3s_api_vip }}"
          write-kubeconfig-mode: "0640"
      no_log: true

    - name: Install pinned K3s server without starting it
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_SKIP_START=true sh -s - server
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/k3s.service

    - name: Start K3s without waiting for the first start attempt
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
        no_block: true

    - name: Wait for the local K3s API to become ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - --request-timeout=10s
          - get
          - --raw=/readyz
      register: k3s_ready
      until: k3s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
