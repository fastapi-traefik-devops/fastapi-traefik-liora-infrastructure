---
- name: Join remaining K3s servers through kube-vip
  hosts: "k3s_servers:!{{ groups['k3s_servers'][0] }}"
  become: true
  serial: 1

  tasks:
    - name: Create K3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write joining-server K3s configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          server: "https://{{ k3s_api_vip }}:6443"
          token: "{{ k3s_token }}"
          node-ip: "{{ node_ip }}"
          tls-san:
            - "{{ k3s_api_vip }}"
          write-kubeconfig-mode: "0640"
      no_log: true

    - name: Install pinned K3s server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Ensure K3s is running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for node-local K3s API
      ansible.builtin.wait_for:
        host: "{{ node_ip }}"
        port: 6443
        timeout: 240
