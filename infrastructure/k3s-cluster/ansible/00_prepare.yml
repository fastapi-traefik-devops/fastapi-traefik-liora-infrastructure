---
- name: Prepare all K3s nodes
  hosts: k3s_servers
  become: true
  serial: 3

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install node packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - jq
          - openssl
          - qemu-guest-agent
          - conntrack
          - socat
          - tcpdump
        state: present

    - name: Enable QEMU guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      failed_when: false

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# disabled-for-k3s: \1'

    - name: Configure required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure sysctl for K3s
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k3s.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Reload sysctl

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
