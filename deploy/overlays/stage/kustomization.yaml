apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-stage
resources:
- ../../base
images:
- name: backend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-backend
  newTag: sha-3303e93b753e8282dc7b461c583fb8ace43574a1
  digest: sha256:ea2d0aaf163f15f1bf749ee69822ebe33e619d2a00a5813d348732936b56f00b
- name: frontend
  newName: ghcr.io/fastapi-traefik-devops/fastapi-frontend
  newTag: sha-3303e93b753e8282dc7b461c583fb8ace43574a1
  digest: sha256:a8d07b6be8ae8c76cc8133c885ba8ec3c095ded005db251aaf6a190e88426f82
replicas:
- name: backend
  count: 1
- name: frontend
  count: 1
patches:
- target:
    kind: ConfigMap
    name: backend-config
  patch: "apiVersion: v1\ndata:\n  BACKEND_CORS_ORIGINS: https://stage.example.com\n\
    \  DOMAIN: stage.example.com\n  ENVIRONMENT: staging\n  FRONTEND_HOST: https://stage.example.com\n\
    kind: ConfigMap\nmetadata:\n  name: backend-config\n"
- target:
    kind: Ingress
    name: app-ingress
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: stage.example.com\n\
    - op: replace\n  path: /spec/tls/0/hosts/0\n  value: stage.example.com\n"
