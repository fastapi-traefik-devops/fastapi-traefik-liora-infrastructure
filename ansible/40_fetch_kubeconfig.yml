---
- name: Fetch cluster kubeconfig
  hosts: "{{ groups['k3s_servers'][0] }}"
  become: true

  tasks:
    - name: Ensure local artifacts directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/artifacts"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch kubeconfig from first server
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/artifacts/kubeconfig.raw"
        flat: true

    - name: Create kubeconfig that uses the API VIP
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/artifacts/kubeconfig"
        mode: "0600"
        content: >-
          {{
            lookup('ansible.builtin.file', playbook_dir + '/artifacts/kubeconfig.raw')
            | regex_replace('https://127\\.0\\.0\\.1:6443',
                            'https://' + k3s_api_vip + ':6443')
          }}
      delegate_to: localhost
      become: false
