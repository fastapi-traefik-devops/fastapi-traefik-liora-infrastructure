evaluation_interval: 1m
tests:
- name: Shared filesystem claims emit one node-level warning
  interval: 1m
  input_series:
  - series: kubelet_volume_stats_available_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 15x25
  - series: kubelet_volume_stats_capacity_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_inodes_free{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 90x25
  - series: kubelet_volume_stats_inodes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_available_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="second",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 15x25
  - series: kubelet_volume_stats_capacity_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="second",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_inodes_free{namespace="TEST_NAMESPACE",persistentvolumeclaim="second",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 90x25
  - series: kubelet_volume_stats_inodes{namespace="TEST_NAMESPACE",persistentvolumeclaim="second",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  promql_expr_test:
  - expr: PVCBackingFilesystemSpaceLow
    eval_time: 20m
    exp_samples:
    - labels: '{node="n1"}'
      value: 0.15
  - expr: PVCBackingFilesystemSpaceCritical
    eval_time: 20m
    exp_samples: []
- name: Critical bytes and inode pressure remain distinguishable
  interval: 1m
  input_series:
  - series: kubelet_volume_stats_available_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 5x25
  - series: kubelet_volume_stats_capacity_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_inodes_free{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 3x25
  - series: kubelet_volume_stats_inodes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  promql_expr_test:
  - expr: PVCBackingFilesystemSpaceCritical
    eval_time: 20m
    exp_samples:
    - labels: '{node="n1"}'
      value: 0.05
  - expr: PVCBackingFilesystemInodesLow
    eval_time: 20m
    exp_samples:
    - labels: '{node="n1"}'
      value: 0.03
  - expr: PVCBackingFilesystemInodesCritical
    eval_time: 20m
    exp_samples:
    - labels: '{node="n1"}'
      value: 0.03
- name: Proxy duplicates and claim request sizes do not create false quota alarms
  interval: 1m
  input_series:
  - series: kubelet_volume_stats_available_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 90x25
  - series: kubelet_volume_stats_capacity_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_inodes_free{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 90x25
  - series: kubelet_volume_stats_inodes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data",node="n1",job="kubelet",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_available_bytes{namespace="default",persistentvolumeclaim="data",node="n1",job="apiserver",metrics_path="/metrics"}
    values: '0x25'
  - series: kubelet_volume_stats_capacity_bytes{namespace="default",persistentvolumeclaim="data",node="n1",job="apiserver",metrics_path="/metrics"}
    values: 100x25
  - series: kubelet_volume_stats_inodes_free{namespace="default",persistentvolumeclaim="data",node="n1",job="apiserver",metrics_path="/metrics"}
    values: '0x25'
  - series: kubelet_volume_stats_inodes{namespace="default",persistentvolumeclaim="data",node="n1",job="apiserver",metrics_path="/metrics"}
    values: 100x25
  - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="TEST_NAMESPACE",persistentvolumeclaim="data"}
    values: 2x25
  promql_expr_test:
  - expr: PVCBackingFilesystemSpaceLow
    eval_time: 20m
    exp_samples: []
  - expr: PVCBackingFilesystemInodesLow
    eval_time: 20m
    exp_samples: []
