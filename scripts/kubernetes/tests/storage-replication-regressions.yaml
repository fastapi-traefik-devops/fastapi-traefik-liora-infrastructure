  - eval_time: 4m
    alertname: PVCBackingFilesystemSpaceCritical
    exp_alerts: []
  - eval_time: 6m
    alertname: PVCBackingFilesystemSpaceCritical
    exp_alerts:
    - exp_labels:
        cluster: TEST_CLUSTER
        environment: TEST_PLATFORM_ENV
        node: n1
        severity: critical
      exp_annotations:
        summary: PVC backing filesystem available space below 10 percent
        description: One or more mounted PVCs on this node share a filesystem below the threshold. This is backing
          filesystem headroom, not per-claim quota usage.
        action: Inspect canonical kubelet volume stats and PVC-to-node mapping; identify growth and filesystem capacity
          before considering expansion or cleanup. Do not delete data blindly.
        runbook_url: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-infrastructure/blob/main/docs/operations/STORAGE_REPLICATION_ALERTS.md
  - eval_time: 20m
    alertname: PVCBackingFilesystemSpaceCritical
    exp_alerts: []
